name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-android:
    name: Native loader (Android NDK, arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libncmkloader.so + mods
        run: |
          sudo apt-get install -y ninja-build
          ./Native/build.sh "$ANDROID_NDK_LATEST_HOME"
      - name: Check ELF (names, exports, dependencies, 16 KB pages)
        run: |
          set -euo pipefail
          OUT=Native/out/arm64-v8a
          ls -la "$OUT"
          # NCMK names only: loader + both samples, nothing with the old libncs* names.
          for f in libncmkloader.so libncmkmod_helloworld.so libncmkmod_debugoverlay.so; do
            test -f "$OUT/$f" || { echo "missing $f"; exit 1; }
          done
          if ls "$OUT" | grep -q '^libncs'; then echo "legacy libncs* output found"; exit 1; fi
          for f in "$OUT"/*.so; do
            echo "== $f"
            readelf -h "$f" | grep -q AArch64
            readelf -d "$f" | grep NEEDED
            # Self-contained: c++_static, only Android system libraries (like the game's libmain.so).
            if readelf -d "$f" | grep NEEDED | grep -vE '\[(liblog|libdl|libc|libm)\.so\]'; then
              echo "unexpected dependency in $f"; exit 1
            fi
            readelf -lW "$f" | awk '$1=="LOAD" && $NF!="0x4000" { bad=1 } END { exit bad }' || { echo "LOAD not 16 KB aligned in $f"; exit 1; }
          done
          SYMS() { readelf -Ws --dyn-syms "$1"; }
          SYMS $OUT/libncmkloader.so | grep -q ' NCMK_GetHostApi$'
          SYMS $OUT/libncmkloader.so | grep -q ' NCMK_Shutdown$'
          SYMS $OUT/libncmkmod_helloworld.so | grep -qE ' NCMKMod_GetInfo$'
          SYMS $OUT/libncmkmod_helloworld.so | grep -qE ' NCMKMod_Load$'
          SYMS $OUT/libncmkmod_debugoverlay.so | grep -qE ' NCMKMod_OnUpdate$'
          SYMS $OUT/libncmkmod_debugoverlay.so | grep -qE ' NCMKMod_OnSceneLoaded$'
          if SYMS $OUT/libncmkloader.so | grep -q ' NCS'; then echo "loader still exports NCS* symbols"; exit 1; fi
          echo "ELF checks passed"
      - uses: actions/upload-artifact@v4
        with:
          name: NCMK-native-arm64-v8a
          path: Native/out/arm64-v8a/*.so

  host-test:
    name: Loader end-to-end host test + unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet test Patcher/NightClubPatcher.Tests
      - name: Host end-to-end test (patched libmain -> loader -> dispatcher -> fake il2cpp -> mods), GCC Debug
        run: ./Native/Tests/run_host_test.sh
      - name: docs/MODDING.md example mod compiles and loads
        run: ./Native/Tests/check_doc_example.sh
      - name: Host end-to-end test, Clang Release (NDEBUG SDK paths)
        run: BUILD_DIR="$PWD/Native/build-host-clang" BUILD_TYPE=Release CC=clang CXX=clang++ ./Native/Tests/run_host_test.sh
      - name: Upload host test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-logs
          path: |
            Native/build-host*/host_game*.log
            Native/build-host*/NCMKMods/Logs/latest.log
          if-no-files-found: ignore

  windows:
    name: Windows release (GUI NightClubPatcher.exe + CLI)
    runs-on: windows-latest
    needs: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Get the native loader built by the NDK job
        uses: actions/download-artifact@v4
        with:
          name: NCMK-native-arm64-v8a
          path: Native/out/arm64-v8a
      - name: Build-Windows.ps1 (build, test, publish, assemble Release, smoke-test GUI + CLI)
        shell: pwsh
        run: ./Build-Windows.ps1 -SmokeTest
      - name: Upload crash logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-crash-logs
          path: Release/Logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NightClubPatcher-Release-win-x64
          path: |
            Release
            !Release/Backups
            !Release/Builds
            !Release/Keys
            !Release/Cache

  windows-clean-setup:
    name: Windows clean-machine setup (download NDK/CMake/Ninja/JDK/adb, build loader)
    runs-on: windows-latest
    env:
      # Ignore the runner's preinstalled Android SDK / JDK / CMake: behave like a clean Windows PC.
      NCMK_BUNDLED_TOOLS_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Release without a prebuilt loader
        shell: pwsh
        run: ./Build-Windows.ps1 -SkipTests
      - name: Install / Repair Tools (all six tools into Release\Tools)
        shell: pwsh
        run: |
          .\Release\NightClubPatcher.Cli.exe --install-tools --accept-licenses
          if ($LASTEXITCODE) { throw "install-tools failed" }
          Get-Content .\Release\Tools\tools.json
      - name: Second run must not download anything
        shell: pwsh
        run: |
          $out = .\Release\NightClubPatcher.Cli.exe --install-tools --accept-licenses 2>&1 | Out-String
          Write-Host $out
          if ($out -match "Downloading") { throw "tools were downloaded again" }
      - name: Build Native Loader with the bundled NDK / CMake / Ninja
        shell: pwsh
        run: |
          .\Release\NightClubPatcher.Cli.exe --build-native
          if ($LASTEXITCODE) { throw "build-native failed" }
          if (-not (Test-Path .\Release\Native\out\arm64-v8a\libncmkloader.so)) { throw "libncmkloader.so missing" }
      - name: Setup status must be all Ready
        shell: pwsh
        run: |
          .\Release\NightClubPatcher.Cli.exe --check-tools
          if ($LASTEXITCODE) { throw "some tools are not ready" }
      - name: GUI smoke test from the fully set-up Release folder
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\Release\NightClubPatcher.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "GUI smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed ($($p.ExitCode))" }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-setup-logs
          path: |
            Release/Logs
            Release/Tools/tools.json
          if-no-files-found: ignore
