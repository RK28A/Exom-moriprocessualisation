name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-android:
    name: Native loader (Android NDK, arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libncsloader.so + mods
        run: |
          sudo apt-get install -y ninja-build
          ./Native/build.sh "$ANDROID_NDK_LATEST_HOME"
      - name: Check ELF
        run: |
          for f in Native/out/arm64-v8a/*.so; do
            readelf -h "$f" | grep -q AArch64
            readelf -d "$f" | grep NEEDED
          done
          readelf -Ws --dyn-syms Native/out/arm64-v8a/libncsmod_helloworld.so | grep -E "NCSMod_(GetInfo|Load)"
      - uses: actions/upload-artifact@v4
        with:
          name: NightClubModKit-native-arm64-v8a
          path: Native/out/arm64-v8a/*.so

  host-test:
    name: Loader end-to-end host test + unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet test Patcher/NightClubPatcher.Tests
      - name: Host end-to-end test (patched libmain -> loader -> fake il2cpp -> mods)
        run: ./Native/Tests/run_host_test.sh

  windows:
    name: Windows release (GUI NightClubPatcher.exe + CLI)
    runs-on: windows-latest
    needs: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Get the native loader built by the NDK job
        uses: actions/download-artifact@v4
        with:
          name: NightClubModKit-native-arm64-v8a
          path: Native/out/arm64-v8a
      - name: Build-Windows.ps1 (build, test, publish, assemble Release, smoke-test GUI + CLI)
        shell: pwsh
        run: ./Build-Windows.ps1 -SmokeTest
      - name: Upload crash logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-crash-logs
          path: Release/Logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NightClubPatcher-Release-win-x64
          path: |
            Release
            !Release/Backups
            !Release/Builds
            !Release/Keys
            !Release/Cache
